<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF8A5B">
<title>SEL 情緒點名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EA; --card:#FFFFFF; --ink:#2A2440; --muted:#7A7391; --line:#F1E6D4;
  --coral:#FF6B6B; --orange:#FF9F45; --yellow:#FFD93D; --green:#6BCB77; --blue:#4D96FF; --purple:#9B72F2; --pink:#FF8FC7;
  --shadow:0 8px 24px rgba(255,140,90,.15);
  color-scheme: light;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Sans TC",system-ui,sans-serif;line-height:1.6;-webkit-tap-highlight-color:transparent;
  background-color:var(--bg);
  background-image:
    radial-gradient(circle at 12% 18%, rgba(255,217,61,.35) 0 6px, transparent 7px),
    radial-gradient(circle at 82% 8%, rgba(77,150,255,.25) 0 5px, transparent 6px),
    radial-gradient(circle at 70% 46%, rgba(255,107,107,.22) 0 4px, transparent 5px),
    radial-gradient(circle at 24% 72%, rgba(107,203,119,.28) 0 5px, transparent 6px),
    radial-gradient(circle at 90% 88%, rgba(155,114,242,.22) 0 6px, transparent 7px);
  background-size:260px 260px;}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 48px}

/* 標題橫幅 */
.banner{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;color:#fff;
  background:linear-gradient(120deg,#FF6B6B 0%,#FF9F45 45%,#FFD93D 100%);box-shadow:var(--shadow)}
.banner::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-36px;height:60px;border-radius:50%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 2px,transparent 2px 46px);opacity:.6}
.banner .top{display:flex;align-items:flex-start;gap:10px;position:relative;z-index:1}
.banner h1{margin:0;font-size:22px;font-weight:900;line-height:1.25;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.banner h1 .en{color:rgba(255,255,255,.9);font-size:13px;font-weight:700}
.banner .sub{color:rgba(255,255,255,.95);font-size:12px;margin-top:4px}
.banner .sub .en{color:rgba(255,255,255,.85)}
.balls{position:absolute;right:12px;bottom:6px;display:flex;gap:6px;font-size:22px;z-index:1}
.balls span{display:inline-block;animation:bounce 1.6s ease-in-out infinite}
.balls span:nth-child(2){animation-delay:.2s}.balls span:nth-child(3){animation-delay:.4s}.balls span:nth-child(4){animation-delay:.6s}
@keyframes bounce{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
.en{display:block;font-size:.82em;font-weight:400;color:var(--muted);line-height:1.4}
.lang{margin-left:auto;display:flex;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;color:#fff;font:inherit;font-size:12px;font-weight:700;padding:5px 9px;cursor:pointer}
.lang button.on{background:#fff;color:var(--coral)}

/* 跑道進度條 */
.track{position:relative;height:34px;margin:16px 4px 14px;border-radius:17px;
  background:linear-gradient(#FF8A65,#FF7043);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.track::before{content:"";position:absolute;left:14px;right:34px;top:50%;border-top:2px dashed rgba(255,255,255,.7)}
.track .flag{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:18px}
.track .pin{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;opacity:.6}
.track .runner{position:absolute;top:50%;font-size:24px;transform:translate(-50%,-58%) scaleX(-1);transition:left .6s cubic-bezier(.3,1.4,.5,1)}

.card{position:relative;background:var(--card);border-radius:22px;padding:22px 20px 20px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,var(--coral),var(--orange),var(--yellow),var(--green),var(--blue),var(--purple))}
.card h2{font-size:19px;margin:0 0 4px;line-height:1.35;font-weight:900}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:#FFF0D9;color:#E07B00;margin-bottom:8px}
.tag .en{display:inline;font-size:inherit;font-weight:700;margin-left:4px;color:inherit;opacity:.75}
.sub{color:var(--muted);font-size:13px;margin:0}
label{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
label .en{display:inline;margin-left:6px}
input[type=text],select,textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#FFFCF6;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);background:#fff}
textarea{min-height:72px;resize:vertical}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 0 0;font-weight:400;cursor:pointer}
.check .en{display:block;margin:0}
.check input{width:22px;height:22px;accent-color:var(--coral);flex:none}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:13px;font:inherit;font-size:16px;font-weight:900;color:#fff;cursor:pointer;margin-top:18px;
  background:linear-gradient(120deg,var(--coral),var(--orange));box-shadow:0 6px 0 #E0554F;transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #E0554F}
.btn .en{color:rgba(255,255,255,.9);font-weight:700}
.btn:disabled{background:#D9D3E3;box-shadow:0 6px 0 #C2BBCF;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);margin-top:12px}
.btn.ghost .en{color:var(--muted)}
.btn.blue{background:linear-gradient(120deg,#4D96FF,#9B72F2);box-shadow:0 6px 0 #3C74D6}
.hidden{display:none!important}
.err{color:var(--coral);font-size:13px;margin-top:8px;min-height:1em;font-weight:700}
.hint{font-size:13px;font-weight:700;color:#E07B00;text-align:center;margin-top:10px}
.hint .en{color:#E07B00;opacity:.8}

/* 情緒地圖 */
.meter{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;margin:12px 0 4px;touch-action:none;cursor:crosshair;user-select:none;border:4px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.meter .qd{position:absolute;width:50%;height:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:900;font-size:16px;color:rgba(0,0,0,.55);transition:filter .25s}
.meter .qd .en{color:rgba(0,0,0,.45);font-size:11px;font-weight:700}
.qd.a{left:0;top:0;background:linear-gradient(135deg,#FF5A5F,#FF9A9E)}
.qd.b{right:0;top:0;background:linear-gradient(225deg,#FFC300,#FFE57A)}
.qd.c{left:0;bottom:0;background:linear-gradient(45deg,#4D96FF,#A8CBFF)}
.qd.d{right:0;bottom:0;background:linear-gradient(315deg,#3DBE74,#A9EBC3)}
.meter.dim .qd:not(.act){filter:saturate(.3) brightness(1.1)}
.axis{position:absolute;background:rgba(255,255,255,.85)}
.axis.x{left:0;right:0;top:50%;height:3px;margin-top:-1.5px}.axis.y{top:0;bottom:0;left:50%;width:3px;margin-left:-1.5px}
.dot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;border:4px solid var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.3);transition:left .15s,top .15s;display:grid;place-items:center;font-size:19px;pointer-events:none;z-index:2}
.dot.wait{animation:pulse 1.2s ease-in-out infinite;border-color:var(--orange)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.bubble{position:absolute;transform:translate(-50%,-100%);margin-top:-26px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;transition:left .15s,top .15s;z-index:3;line-height:1.3;text-align:center}
.bubble .en{color:#D6D0E6;font-size:10px}
.meter.dragging .dot,.meter.dragging .bubble{transition:none}
.axlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700}
.axlbl .en{font-weight:400}
.slider{margin-top:16px}
.slider .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;font-weight:700}
.slider .val{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:22px;color:var(--orange)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:7px;margin:8px 0 2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;border-radius:50%;background:#fff;border:5px solid var(--orange);box-shadow:0 3px 8px rgba(0,0,0,.2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--orange);cursor:pointer}
#sV{background:linear-gradient(90deg,#4D96FF,#E8E3F0 50%,#FFC300)}
#sA{background:linear-gradient(90deg,#A8CBFF,#E8E3F0 50%,#FF5A5F)}
#sB{background:linear-gradient(90deg,#D9D3E3,#6BCB77)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.ends span:last-child{text-align:right}
.qbadge{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;margin-top:14px;font-size:14px;transition:background .25s;background:#FFF3E0}

/* 情緒詞 */
.wgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:10px}
.wgrid h4{grid-column:1/-1;margin:10px 0 2px;font-size:14px}
.w{min-width:0;overflow-wrap:anywhere;border:0;padding:7px 0;min-height:50px;font:inherit;font-size:12px;letter-spacing:-.03em;font-weight:700;line-height:1.25;cursor:pointer;color:var(--ink);border-radius:12px;position:relative;transition:transform .1s}
.w:active{transform:scale(.94)}
.w .en{font-size:9.5px;letter-spacing:0;color:rgba(42,36,64,.6)}
.w.on{color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.w.on .en{color:rgba(255,255,255,.9)}
.w.here::after{content:"📍";position:absolute;top:-6px;right:-3px;font-size:12px}
.picked{font-size:13px;margin-top:10px;min-height:1.4em}
.linkbtn{background:none;border:0;color:var(--blue);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 0;margin-top:6px}
.linkbtn .en{display:inline;margin-left:6px;color:inherit}

/* 結果 */
.ok{font-size:14px;font-weight:700;padding:12px 14px;border-radius:16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.ok .ic{font-size:28px}
.hero{border-radius:22px;padding:22px 20px;margin-bottom:16px;color:var(--ink);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h2{margin:0;font-size:22px;line-height:1.3;font-weight:900}
.hero p{margin:6px 0 0;font-size:14px}
.hero .en{color:rgba(42,36,64,.7)}
.hero .big{font-size:44px;line-height:1}
.strat{border-radius:16px;padding:12px 14px;margin:12px 0}
.strat h3{font-size:15px;margin:0 0 4px}
.strat ul{margin:0;padding-left:18px;font-size:14px}
.strat li{margin:6px 0}
.pe{background:#FFF3E0;border-radius:16px;padding:12px 14px;font-size:14px;margin-top:10px}

/* 呼吸 */
.seg{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.seg button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;line-height:1.3}
.seg button .en{font-size:10px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.seg button.on .en{color:#D6D0E6}
.stage{position:relative;height:290px;margin-top:12px;border-radius:20px;overflow:hidden;display:grid;place-items:center;transition:background 1.2s}
.circle{width:170px;height:170px;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;font-weight:900;font-size:18px;color:#fff;transform:scale(.55);
  transition:transform 4s ease-in-out, background 1.2s, box-shadow 1.2s;line-height:1.3;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.circle .en{color:rgba(255,255,255,.9)}
.ring{position:absolute;width:236px;height:236px;border-radius:50%;border:3px dashed rgba(255,255,255,.9);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.seed{position:absolute;inset:0}
.seed svg{width:100%;height:100%;display:block}
.phase{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:99px;padding:4px 14px;font-weight:900;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:2}
.phase .en{display:inline;margin-left:6px}
.leaf,.petals{transform-box:fill-box;transition:transform 1s cubic-bezier(.3,1.5,.5,1)}
.rain line{animation:drop .9s linear infinite;opacity:0;transition:opacity .4s}
.raining .rain line{opacity:1}
@keyframes drop{0%{transform:translateY(-6px)}100%{transform:translateY(70px)}}
.rays{transform-origin:260px 46px;animation:spin 10s linear infinite}
.sun{transition:opacity 1s}

/* 運動小卡 */
.draw{perspective:900px;margin:12px auto 0;max-width:320px}
.flip{position:relative;transition:transform .7s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d;height:450px}
.flip.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;padding:16px;text-align:center}
.face.back{justify-content:center;cursor:pointer;color:#fff;border:6px solid #fff;box-shadow:var(--shadow);
  background:conic-gradient(from 45deg,#FF6B6B,#FF9F45,#FFD93D,#6BCB77,#4D96FF,#9B72F2,#FF6B6B)}
.face.back .inner{background:rgba(255,255,255,.92);color:var(--ink);border-radius:20px;padding:22px 26px;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.face.back .big{font-size:56px;line-height:1;animation:bounce 1.6s ease-in-out infinite}
.face.front{transform:rotateY(180deg);background:#FFFDF7;border:6px solid #fff;box-shadow:var(--shadow);color:var(--ink);justify-content:flex-start}
.face.front svg{width:220px;height:220px;margin-top:4px;flex:none}
.cardtop{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.sport{font-size:12px;font-weight:900;padding:3px 12px;border-radius:99px;color:var(--ink)}
.season{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:#fff;border:1.5px solid var(--line);color:var(--muted)}
.quote{font-size:16px;font-weight:900;margin-top:4px;line-height:1.5;padding:0 4px}
.quote .en{color:var(--muted);font-size:12.5px;font-weight:500;margin-top:4px}
.cardfoot{position:absolute;left:14px;right:14px;bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;font-size:10px;color:var(--muted)}
.cardfoot .sig{font-family:"Baloo 2",sans-serif;font-style:italic;font-weight:600;letter-spacing:.02em}
.cardfoot .no{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:12px;color:var(--orange)}

/* PERMA 抽籤 */
.perma{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pm{border:3px solid transparent;border-radius:18px;padding:10px 4px;font:inherit;cursor:pointer;text-align:center;line-height:1.3;color:var(--ink);transition:transform .15s}
.pm:active{transform:scale(.95)}
.pm b{display:block;font-family:"Baloo 2",sans-serif;font-size:30px;font-weight:800;line-height:1.1}
.pm span{font-size:13px;font-weight:900}
.pm .en{font-size:10px}
.pm.on{border-color:var(--ink);transform:translateY(-2px)}
.pdetail{margin-top:14px;padding:16px;border-radius:18px;text-align:center}
.pdetail h3{margin:0 0 4px;font-size:17px}
.pdetail p{margin:0 0 8px;font-size:13px}
.cup{font-size:64px;line-height:1;display:inline-block;margin:6px 0}
.cup.shake{animation:shake .12s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-14deg) translateY(-2px)}to{transform:rotate(14deg) translateY(2px)}}
.stick{margin:14px auto 0;max-width:300px;background:#fff;border-radius:16px;padding:16px 16px 14px;box-shadow:0 4px 0 rgba(0,0,0,.06);border:3px solid;position:relative;font-size:15px;font-weight:700;min-height:60px}
.stick .no{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;padding:1px 10px;border-radius:99px;white-space:nowrap}
.stick .en{font-weight:500}
.stick.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.mission{margin-top:12px;font-size:13px;font-weight:700;background:#FFF8D6;border-radius:14px;padding:10px 12px}
.row2{display:flex;gap:8px}
.row2 .btn{margin-top:12px;font-size:14px;padding:11px}
.foot{font-size:11px;color:var(--muted);text-align:center;margin-top:24px}
.foot .en{font-size:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <div class="top">
      <div>
        <h1 data-t="SEL 情緒點名|SEL Mood Check-in"></h1>
        <div class="sub" id="courseSub"></div>
      </div>
      <div class="lang" id="lang">
        <button data-l="both">中/EN</button><button data-l="zh">中</button><button data-l="en">EN</button>
      </div>
    </div>
    <div style="height:26px"></div>
    <div class="balls"><span>🏀</span><span>⚽</span><span>🏸</span><span>🎾</span></div>
  </div>

  <div class="track" id="track">
    <span class="pin" style="left:6%"></span><span class="pin" style="left:34%"></span><span class="pin" style="left:62%"></span><span class="pin" style="left:88%"></span>
    <span class="runner" id="runner" style="left:6%">🏃</span><span class="flag">🏁</span>
  </div>

  <!-- STEP 1 點名 -->
  <section id="step1" class="card">
    <span class="tag" data-t="STEP 1 · 點名|Attendance"></span>
    <h2 data-t="嗨！先確認你是誰 👋|Hi! Tell us who you are 👋"></h2>
    <div id="courseBox">
      <label for="course" data-t="課程班別|Class"></label>
      <select id="course"></select>
    </div>
    <label for="dept" data-t="系級|Dept. & Year"></label>
    <input type="text" id="dept" data-p="例：體育系二年級|e.g. PE, Year 2" autocomplete="organization">
    <label for="sid" data-t="學號|Student ID"></label>
    <input type="text" id="sid" data-p="例：411234567|e.g. 411234567" autocomplete="off">
    <label for="name" data-t="姓名|Name"></label>
    <input type="text" id="name" data-p="例：王小明|e.g. Wang Xiao-Ming" autocomplete="name">
    <label class="check"><input type="checkbox" id="remember" checked><span data-t="記住我的資料（下次免填）|Remember me on this device"></span></label>
    <div class="err" id="err1"></div>
    <button class="btn" id="to2" data-t="下一步：情緒 Check-in →|Next: Mood check-in →"></button>
  </section>

  <!-- STEP 2 情緒象限 -->
  <section id="step2" class="card hidden">
    <span class="tag" data-t="STEP 2 · 自我覺察|Self-awareness"></span>
    <h2 data-t="此刻的你，在哪個情緒象限？|Where are you on the mood meter right now?"></h2>
    <p class="sub" data-t="拖動下方兩根拉桿，或直接在圖上點選／拖曳圓點|Move the two sliders, or tap / drag the dot on the map"></p>
    <div class="axlbl" style="margin-top:12px"><span data-t="⚡ 高能量|⚡ High energy"></span></div>
    <div class="meter" id="meter">
      <div class="qd a" data-q="2" data-t="警戒紅|Red · Alert"></div>
      <div class="qd b" data-q="1" data-t="活力黃|Yellow · Energized"></div>
      <div class="qd c" data-q="3" data-t="低能藍|Blue · Low"></div>
      <div class="qd d" data-q="4" data-t="平靜綠|Green · Calm"></div>
      <div class="axis x"></div><div class="axis y"></div>
      <div class="dot wait" id="dot">👆</div>
      <div class="bubble hidden" id="bubble"></div>
    </div>
    <div class="axlbl"><span data-t="🌙 低能量 · 不愉快 ←|🌙 Low energy · Unpleasant ←"></span><span data-t="→ 愉快|→ Pleasant"></span></div>

    <div class="slider">
      <div class="row"><span data-t="😣 心情愉快度 😄|😣 Pleasantness 😄"></span><span class="val" id="vV">?</span></div>
      <input type="range" id="sV" min="1" max="10" value="5" aria-label="Pleasantness">

function applyLang(){
  document.documentElement.lang = LANG === 'en' ? 'en' : 'zh-Hant';
  document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = t(el.dataset.t.split('|')));
  document.querySelectorAll('[data-p]').forEach(el => el.placeholder = plain(el.dataset.p.split('|')));
  $('lang').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  updateCourseSub();
  render();
  if (!$('step3').classList.contains('hidden')) buildWords();
  if (!$('step4').classList.contains('hidden')) showResult(lastData, lastMsg);

}

const params = new URLSearchParams(location.search);

const WD = ['','一','二','三','四','五','六','日'], WDE = ['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function courseLabel(c){
  if (!c || !c.start) return '';
  const d = c.days || [];
  return plain([`週${d.map(x=>WD[x]).join('、')} ${c.start}${c.period?'・第'+c.period+'節':''}`, `${d.map(x=>WDE[x]).join('/')} ${c.start}${c.period?' · P'+c.period:''}`]);
}
function updateCourseSub(){
  const name = fixedCourse || $('course').value;
  const c = courseList.find(x => x.name === name);
  $('courseSub').innerHTML = (name ? `📍 ${esc(name)}${c && c.start ? '｜' + courseLabel(c) : ''}<br>` : '') + t(['體育課情緒 Check-in','PE Mood Check-in']);
}
function fillCourses(list){
  $('course').innerHTML = list.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');
  // 自動選擇「今天、現在」正在上的課
  const now = new Date(), dow = now.getDay() || 7, mins = now.getHours()*60 + now.getMinutes();
  const toM = s => { const m = /(\d+):(\d+)/.exec(s||''); return m ? +m[1]*60 + +m[2] : null; };
  // 同一天連堂（例如週五 1-2、3-4 節）時，選「上課時間最接近現在」的那一堂
  let live = null, best = 1e9;
  list.forEach(c => {
    const s0 = toM(c.start); if (s0 == null || !(c.days||[]).includes(dow)) return;
    const e0 = toM(c.end) ?? s0 + 120;
    if (mins < s0 - 40 || mins > e0) return;
    const diff = Math.abs(mins - s0); if (diff < best) { best = diff; live = c; }
  });
  const last = store.get('sel_course');
  if (live) $('course').value = live.name;
  else if (last && list.some(c => c.name === last)) $('course').value = last;
  updateCourseSub();
}
$('course').onchange = updateCourseSub;

}

function touch(){
  if (state.touched) return;

  $('to3').disabled = false; $('hint2').classList.add('hidden');
}

function fromPointer(e){
  const r = meter.getBoundingClientRect();
  const x = Math.min(Math.max((e.clientX-r.left)/r.width,0),0.999), y = Math.min(Math.max((e.clientY-r.top)/r.height,0),0.999);
  touch(); state.v = Math.floor(x*10)+1; state.a = 10-Math.floor(y*10); render();
}
meter.addEventListener('pointerdown', e => { meter.setPointerCapture(e.pointerId); meter.classList.add('dragging'); fromPointer(e); });

      return;
    }
    const [kind,sec,round]=seq[i++]; let left=sec;
    const c=$('circle'); setPhase(kind);
    if (kind === 'in') scaleNow = 1; else if (kind === 'out') scaleNow = .55;
    c.style.transitionDuration = `${sec}s, 1.2s, 1.2s`;
    c.style.transform = `scale(${scaleNow})`;
    $('bInfo').innerHTML = T(`第 ${round} / 3 輪`,`Round ${round} / 3`);
    const icon = kind==='in' ? '☀️' : kind==='out' ? '🌧️' : '✨';
    const tick = () => {
      c.innerHTML = `${t(PH[kind].t)}<span style="font-family:'Baloo 2';font-size:30px;line-height:1">${left}</span>`;
      $('phase').innerHTML = `${icon} ${T(PH[kind].t[0], PH[kind].t[1])} · ${left}`;
      if (left-- > 0) timer = setTimeout(() => { elapsed++; grow(elapsed/total); tick(); }, 1000);
      else step();
    };
    tick();
  };
  step();
};

// ---- PERMA+ 抽籤 ----
let pSel = null; const drawn = {};
const missionKey = 'sel_mission_' + new Date().toDateString();
let mission = store.get(missionKey);
function renderPerma(){
  $('perma').innerHTML = PERMA.map((p,i) => `<button class="pm${pSel===i?' on':''}" data-i="${i}" style="background:${p.bg}"><b style="color:${p.c}">${p.k}</b><span>${t(p.name)}</span></button>`).join('');
  $('perma').querySelectorAll('.pm').forEach(b => b.onclick = () => { pSel = +b.dataset.i; renderPerma(); });
  const d = $('pdetail');
  if (pSel === null) { d.classList.add('hidden'); return; }
  const p = PERMA[pSel], got = drawn[pSel];
  d.classList.remove('hidden');
  d.style.background = p.bg;
  d.innerHTML = `<h3 style="color:${p.c}">${p.k} · ${t(p.name)}</h3><p>${t(p.desc)}</p>
    <div class="cup" id="cup">🎋</div>
    <div class="stick${got!=null?'':' hidden'}" id="stick" style="border-color:${p.c}"><span class="no" style="background:${p.c}" id="stickNo"></span><div id="stickTxt"></div></div>
    <div class="row2"><button class="btn" id="pDraw" style="background:linear-gradient(120deg,${p.c},${p.c}cc);box-shadow:0 5px 0 ${p.c}88">${got!=null?T('🔄 再抽一次','🔄 Draw again'):T('🎋 搖一搖，抽一支籤','🎋 Shake & draw')}</button>
    ${got!=null?`<button class="btn ghost" id="pAccept">${T('⭐ 就決定是你了','⭐ I\'ll do this')}</button>`:''}</div>
    ${mission?`<div class="mission">⭐ ${T('今日幸福任務：','Today\'s mission: ')}${esc(mission)}</div>`:''}`;
  if (got != null) showStick(p, got, false);
  $('pDraw').onclick = () => {
    const cup = $('cup'); cup.classList.add('shake'); $('pDraw').disabled = true;
    $('stick').classList.remove('hidden');
    let n = 0;
    const spin = setInterval(() => {
      showStick(p, Math.floor(Math.random()*p.opts.length), false);
      if (++n > 9) {
        clearInterval(spin); cup.classList.remove('shake');
        let j; do { j = Math.floor(Math.random()*p.opts.length); } while (j === drawn[pSel]);
        drawn[pSel] = j; renderPerma(); showStick(p, j, true);
      }
    }, 110);
  };
  if ($('pAccept')) $('pAccept').onclick = () => {
    mission = `${p.k}｜${plain(p.opts[drawn[pSel]])}`;
    store.set(missionKey, mission); renderPerma();
  };
}
function showStick(p, j, pop){
  $('stickNo').textContent = plain([`第 ${j+1} 籤`, `Stick #${j+1}`]);
  $('stickTxt').innerHTML = t(p.opts[j]);
  if (pop) { const s = $('stick'); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); }
}

setVisual(visual);
setPhase('in');
applyLang();
</script>
